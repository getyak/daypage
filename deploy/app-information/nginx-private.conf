worker_processes 1;
pid /run/daypage-app-information/nginx.pid;
error_log stderr crit;
events { worker_connections 64; }
http {
    access_log off;
    server_tokens off;
    default_type application/json;
    client_max_body_size 1k;
    client_body_temp_path /run/daypage-app-information/client-body;
    proxy_temp_path /run/daypage-app-information/proxy;
    fastcgi_temp_path /run/daypage-app-information/fastcgi;
    uwsgi_temp_path /run/daypage-app-information/uwsgi;
    scgi_temp_path /run/daypage-app-information/scgi;
    server {
        listen 127.0.0.1:18080;
        server_name daypage-api.cubxxw.com;
        if ($host != daypage-api.cubxxw.com) { return 404; }
        location = /daypage/v1/app-info.json {
            if ($request_method != GET) { return 405; }
            alias /usr/share/daypage-app-information/app-info.json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location / { return 404; }
    }
}
