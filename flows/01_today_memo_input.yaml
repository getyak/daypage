appId: com.daypage.app
---
# Flow 01: Empty Today — require the primary capture path on the fresh CI app.
- launchApp:
    arguments:
      hasOnboarded: "true"
      authSkipped: "true"
      hasSeenWelcome: "true"
      settings.hasRequestedNotifications: "true"
      inputBarTutorialCompleted: "true"
- takeScreenshot: maestro-results/capture/launch

# 等待 Today View 的真实导航入口可交互。
- extendedWaitUntil:
    visible:
      id: "sidebar-menu-button"
    timeout: 10000

- takeScreenshot: maestro-results/capture/today_view_loaded

# Other flows only launch/navigate. This is the suite's sole writer, so the
# freshly installed CI app must still be empty. A missing primary action is a
# real failure, not a reason to pass through the persistent dock instead.
- extendedWaitUntil:
    visible:
      id: "today-capture-write"
    timeout: 10000
- assertVisible:
    id: "^today-hero-title-compact$"
- assertNotVisible:
    id: "^today-hero-title$"
- takeScreenshot: maestro-results/capture/capture_invitation
- tapOn:
    id: "today-capture-write"

# Wait for the bottom-sheet present animation. The sheet is presented
# via SwiftUI .sheet(), which can take 300-500ms to fully render on
# the CI runner before the TextField is hittable — extendedWaitUntil
# gives us a hard ceiling instead of guessing with sleeps.
- extendedWaitUntil:
    visible:
      id: "write-sheet-input"
    timeout: 5000

# Tap the WriteSheet TextField (accessibilityIdentifier="write-sheet-input")
- tapOn:
    id: "write-sheet-input"

- inputText: "E2E note: the capture flow feels calm and direct"
- takeScreenshot: maestro-results/capture/after_input

# Verify the typed text is visible inside the WriteSheet
- assertVisible: "E2E note: the capture flow feels calm and direct"
- takeScreenshot: maestro-results/capture/text_visible_in_input

# Save & dismiss the sheet (accessibilityIdentifier="write-sheet-save")
- tapOn:
    id: "write-sheet-save"

- extendedWaitUntil:
    # Timeline cards intentionally expose a contextual VoiceOver label.
    visible: "Memo: E2E note: the capture flow feels calm and direct"
    timeout: 5000
- takeScreenshot: maestro-results/capture/after_send
