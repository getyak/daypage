appId: com.daypage.app
---
# Flow 01: Today View — 验证输入框可用
- launchApp:
    arguments:
      hasOnboarded: "true"
      authSkipped: "true"
      hasSeenWelcome: "true"
      settings.hasRequestedNotifications: "true"
      inputBarTutorialCompleted: "true"
- takeScreenshot: launch

# 等待 Today View 的真实导航入口可交互。
- extendedWaitUntil:
    visible:
      id: "sidebar-menu-button"
    timeout: 10000

- takeScreenshot: today_view_loaded

# On an empty day, exercise the primary capture action and require the real
# editor before moving on. Existing populated fixtures use the persistent dock.
- runFlow:
    when:
      visible:
        id: "today-capture-write"
    commands:
      - tapOn:
          id: "today-capture-write"
      - extendedWaitUntil:
          visible:
            id: "write-sheet-input"
          timeout: 5000
- runFlow:
    when:
      notVisible:
        id: "write-sheet-input"
    commands:
      - tapOn:
          id: "expand-text-composer"

# Wait for the bottom-sheet present animation. The sheet is presented
# via SwiftUI .sheet(), which can take 300-500ms to fully render on
# the CI runner before the TextField is hittable — extendedWaitUntil
# gives us a hard ceiling instead of guessing with sleeps.
- extendedWaitUntil:
    visible:
      id: "write-sheet-input"
    timeout: 5000

# Tap the WriteSheet TextField (accessibilityIdentifier="write-sheet-input")
- tapOn:
    id: "write-sheet-input"

- inputText: "E2E note: the capture flow feels calm and direct"
- takeScreenshot: after_input

# Verify the typed text is visible inside the WriteSheet
- assertVisible: "E2E note: the capture flow feels calm and direct"
- takeScreenshot: text_visible_in_input

# Save & dismiss the sheet (accessibilityIdentifier="write-sheet-save")
- tapOn:
    id: "write-sheet-save"

- extendedWaitUntil:
    # Timeline cards intentionally expose a contextual VoiceOver label.
    visible: "Memo: E2E note: the capture flow feels calm and direct"
    timeout: 5000
- takeScreenshot: after_send
