name: Local iOS notebook
on:
  workflow_dispatch:
    inputs:
      native_ui:
        description: Run the isolated native UI signing and recovery matrix
        type: boolean
        required: false
        default: false
      native_ui_suite:
        description: Native journeys to run (full retains all existing journeys)
        type: choice
        options: [full, card_tools_speech, diary_navigation]
        default: full
      runner_architecture:
        description: Hosted pool (Intel options are manual capacity fallbacks)
        type: choice
        options: [arm64, intel, intel15]
        default: arm64
  pull_request:
    paths:
      - 'DayPageLocal/**'
      - 'DayPageLocalShare/**'
      - 'DayPageCore/**'
      - 'DayPageLocalWatch/**'
      - 'DayPageLocalUITests/**'
      - 'DayPage/App/Fonts/**'
      - 'DayPage/App/Assets.xcassets/**'
      - 'fastlane/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/testflight.yml'
      - 'scripts/ci/wait_for_release_ci.py'
      - 'scripts/tests/test_local_ios_contract.py'
      - 'scripts/tests/test_local_native_ci.py'
      - 'scripts/qa/run_local_native_ci.sh'
      - 'scripts/tests/test_chat_session_recovery.py'
      - 'scripts/tests/fixtures/chat_session_recovery.swift'
      - 'scripts/tests/fixtures/chat_stream_server.py'
      - 'scripts/tests/test_capture_draft_transactions.py'
      - 'scripts/tests/fixtures/capture_draft_transactions.swift'
      - '.github/workflows/ios-local.yml'
  push:
    branches: [main]
    paths:
      - 'DayPageLocal/**'
      - 'DayPageLocalShare/**'
      - 'DayPageCore/**'
      - 'DayPageLocalWatch/**'
      - 'DayPageLocalUITests/**'
      - 'DayPage/App/Fonts/**'
      - 'DayPage/App/Assets.xcassets/**'
      - 'fastlane/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/testflight.yml'
      - 'scripts/ci/wait_for_release_ci.py'
      - 'scripts/tests/test_local_native_ci.py'
      - 'scripts/qa/run_local_native_ci.sh'
      - 'scripts/tests/test_chat_session_recovery.py'
      - 'scripts/tests/fixtures/chat_session_recovery.swift'
      - 'scripts/tests/fixtures/chat_stream_server.py'
      - 'scripts/tests/test_capture_draft_transactions.py'
      - 'scripts/tests/fixtures/capture_draft_transactions.swift'
      - '.github/workflows/ios-local.yml'
permissions:
  contents: read
concurrency:
  group: local-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Local iOS core and app
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_architecture == 'intel15' && 'macos-15-intel' || github.event_name == 'workflow_dispatch' && inputs.runner_architecture == 'intel' && 'macos-26-intel' || 'macos-15' }}
    # Cold Intel builds exceeded 25 minutes after tests had already passed.
    # Automatic PR/main checks retain their existing ARM budget.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.runner_architecture == 'intel' || inputs.runner_architecture == 'intel15') && 40 || 25 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the installed iOS 26 toolchain on the Intel 15 fallback
        if: github.event_name == 'workflow_dispatch' && inputs.runner_architecture == 'intel15'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Verify native QA failure collection without Xcode or Simulator
        run: python3 scripts/tests/test_local_native_ci.py
      - run: swift test --package-path DayPageCore --jobs 2
      - run: python3 scripts/tests/test_local_ios_contract.py
      - name: Verify chat draft recovery and selected-note boundaries
        run: python3 scripts/tests/test_chat_session_recovery.py --build-path DayPageCore/.build
      - name: Verify capture draft commit and recovery
        run: python3 scripts/tests/test_capture_draft_transactions.py
      - name: Enable the pinned chat renderer macro
        run: |
          mkdir -p "$HOME/Library/org.swift.swiftpm/security"
          cp scripts/ci/local-chat-macros.json "$HOME/Library/org.swift.swiftpm/security/macros.json"
      - name: Build the isolated local app
        run: xcodebuild -project DayPageLocal/DayPageLocal.xcodeproj -scheme DayPage -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build the local Watch companion
        run: xcodebuild -project DayPageLocal/DayPageLocal.xcodeproj -scheme DayPageWatch -configuration Release -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO build

  native-ui:
    name: Native iOS UI (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.native_ui
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_architecture == 'intel15' && 'macos-15-intel' || github.event_name == 'workflow_dispatch' && inputs.runner_architecture == 'intel' && 'macos-26-intel' || 'macos-26' }}
    # The complete matrix includes two signing builds and 58 serial journeys.
    # A measured cold run hit 60 minutes during its final notebook cases.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the installed iOS 26 toolchain on the Intel 15 fallback
        if: github.event_name == 'workflow_dispatch' && inputs.runner_architecture == 'intel15'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Enable the pinned chat renderer macro
        run: |
          mkdir -p "$HOME/Library/org.swift.swiftpm/security"
          cp scripts/ci/local-chat-macros.json "$HOME/Library/org.swift.swiftpm/security/macros.json"
      - name: Verify unsigned recovery and signed native journeys
        # Xcode keeps its normal macro validation; trust only the reviewed exact Equatable revision.
        # The runner is ephemeral and has no shared workstation trust settings.
        env:
          DAYPAGE_NATIVE_CI_OUTPUT_DIR: ${{ runner.temp }}/daypage-native-ui/evidence
          DAYPAGE_NATIVE_UI_SUITE: ${{ inputs.native_ui_suite || 'full' }}
        run: bash scripts/qa/run_local_native_ci.sh
      - name: Preserve isolated native UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-native-ui-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/daypage-native-ui/evidence/*.log
            ${{ runner.temp }}/daypage-native-ui/evidence/*.json
            ${{ runner.temp }}/daypage-native-ui/evidence/*.plist
            ${{ runner.temp }}/daypage-native-ui/evidence/*.sha256
            ${{ runner.temp }}/daypage-native-ui/evidence/*-attachments/*.png
            ${{ runner.temp }}/daypage-native-ui/evidence/*-attachments/*.txt
            ${{ runner.temp }}/daypage-native-ui/evidence/*-attachments/manifest.json
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve full XCTest bundles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-native-ui-xcresult-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daypage-native-ui/evidence/*.xcresult
          retention-days: 7
          if-no-files-found: warn
