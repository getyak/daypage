name: Update TestFlight Changelog

# Async second half of the deploy pipeline:
# 1. `Deploy to TestFlight` uploads the IPA fast (no changelog) and uploads the
#    changelog text as an artifact named `changelog-v<X.Y.Z>`.
# 2. This workflow triggers on that workflow's completion, downloads the
#    changelog artifact, waits until ASC has finished processing the build,
#    then PATCHes the TestFlight "What to Test" via the App Store Connect API.
#
# Why split: passing `changelog` to fastlane's `upload_to_testflight` makes it
# poll until the build appears in the build list, which Apple's backend can
# delay 30+ minutes — exhausting the 1h30m GitHub Actions job timeout. By
# decoupling, the deploy job exits in ~3 min and changelog is restored
# asynchronously without blocking the deploy critical path.
#
# Manual trigger (workflow_dispatch) is the fallback when the auto trigger
# misses or fails — supply the same release_tag from a recent deploy run.

on:
  workflow_run:
    workflows: ["Deploy to TestFlight"]
    types: [completed]

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag from the deploy run (e.g. v0.1.66)"
        required: true
        type: string
      run_id:
        description: "Deploy run id whose changelog artifact to use"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  update_changelog:
    name: Update TestFlight changelog
    runs-on: ubuntu-latest
    # Only accept a successful deploy from this repository's trusted main
    # branch. workflow_run events can otherwise point at untrusted fork code.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'main') }}
    timeout-minutes: 35  # 30-min ASC processing wait + buffer

    steps:
      - name: Resolve source ref and run id
        id: resolve
        env:
          EVENT_NAME:  ${{ github.event_name }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_RUN_ID:   ${{ github.event.workflow_run.id }}
          WR_HEAD_BR:  ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG:   ${{ github.event.inputs.release_tag }}
          INPUT_RUN:   ${{ github.event.inputs.run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [[ ! "$WR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::workflow_run head SHA is invalid"
              exit 1
            fi
            echo "deployed_sha=$WR_HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "run_id=$WR_RUN_ID"     >> "$GITHUB_OUTPUT"
            echo "manual_tag="           >> "$GITHUB_OUTPUT"
            echo "Triggered by deploy run $WR_RUN_ID on branch=$WR_HEAD_BR sha=$WR_HEAD_SHA"
          else
            if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release_tag must match vMAJOR.MINOR.PATCH"
              exit 1
            fi
            if [[ ! "$INPUT_RUN" =~ ^[0-9]+$ ]]; then
              echo "::error::run_id must be numeric"
              exit 1
            fi
            echo "deployed_sha="          >> "$GITHUB_OUTPUT"
            echo "run_id=$INPUT_RUN"     >> "$GITHUB_OUTPUT"
            echo "manual_tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "Manual trigger for tag=$INPUT_TAG run_id=$INPUT_RUN"
          fi

      # Repository scripts below always come from the trusted default branch.
      # The deployed SHA or validated tag is used only as data for git queries.
      - name: Checkout trusted repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0  # need full history for `git rev-list --count`
          persist-credentials: false

      # Recompute the same identifiers fastlane's `increment_build` writes into
      # the IPA. Both runs see the same commit, so the values match.
      - name: Compute build identifiers
        id: ids
        env:
          MANUAL_TAG: ${{ steps.resolve.outputs.manual_tag }}
          DEPLOYED_SHA: ${{ steps.resolve.outputs.deployed_sha }}
        run: |
          set -euo pipefail

          # Marketing version: prefer the manual tag input; otherwise derive from
          # the most recent v* tag pointing at the deployed SHA (deploy creates one).
          if [ -n "$MANUAL_TAG" ]; then
            TAG="$MANUAL_TAG"
            DEPLOYED_REF="$MANUAL_TAG"
          else
            DEPLOYED_REF="$DEPLOYED_SHA"
            TAG=$(git tag --points-at "$DEPLOYED_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1 || true)
            if [ -z "$TAG" ]; then
              TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
            fi
          fi
          if ! git cat-file -e "${DEPLOYED_REF}^{commit}"; then
            echo "::error::Deployed ref is not a repository commit"
            exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not determine release tag for ref"
            exit 1
          fi
          BUILD_NUMBER=$(git rev-list --count "$DEPLOYED_REF")
          MARKETING="${TAG#v}"
          SOURCE_SHA=$(git rev-parse "${DEPLOYED_REF}^{commit}")

          echo "build_number=$BUILD_NUMBER"   >> "$GITHUB_OUTPUT"
          echo "marketing_version=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA"       >> "$GITHUB_OUTPUT"
          echo "Resolved build_number=$BUILD_NUMBER, marketing=$MARKETING, tag=$TAG"

      - name: Download changelog artifact from deploy run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog-${{ steps.ids.outputs.release_tag }}
          path: changelog
          # When triggered by workflow_run, the artifact lives on a different
          # workflow run; supply run-id and github-token to point download-artifact
          # at the right source. For manual dispatch, run_id from inputs is used.
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Recover missing release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ids.outputs.release_tag }}
        run: |
          set -euo pipefail
          if ! python3 -c 'from pathlib import Path; import sys; sys.exit(0 if Path("changelog/changelog.txt").read_text().strip() else 1)'; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid release tag for notes recovery."
              exit 1
            fi
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json body --jq '.body // ""' > changelog/changelog.txt.recovered
            python3 -c 'from pathlib import Path; import sys; sys.exit(0 if Path("changelog/changelog.txt.recovered").read_text().strip() else 1)'
            mv changelog/changelog.txt.recovered changelog/changelog.txt
            echo "Recovered notes from the matching GitHub release."
          fi

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyjwt cryptography

      - name: Read-only Apple API diagnostic
        env:
          APP_STORE_CONNECT_API_KEY_ID:      ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID:       ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          ASC_APP_ID:            ${{ vars.ASC_APP_ID || '6762390618' }}
          BUILD_NUMBER:          ${{ steps.ids.outputs.build_number }}
          MARKETING_VERSION:     ${{ steps.ids.outputs.marketing_version }}
          CHANGELOG_FILE:        changelog/changelog.txt
          LOCALE:                en-US
          MAX_WAIT_SECONDS:      "1800"
          POLL_INTERVAL_SECONDS: "30"
          EXPECTED_BUNDLE_ID:    com.daypage.app
          RELEASE_SOURCE_SHA:   ${{ steps.ids.outputs.source_sha }}
          RELEASE_TAG:          ${{ steps.ids.outputs.release_tag }}
          RELEASE_RECEIPT_FILE: release-receipt.json
        run: |
          python3 - <<'PY'
          import importlib.util,json,os,urllib.request,urllib.error,urllib.parse
          spec=importlib.util.spec_from_file_location("asc","scripts/update_testflight_changelog.py")
          asc=importlib.util.module_from_spec(spec);spec.loader.exec_module(asc)
          token=asc.make_jwt(os.environ["APP_STORE_CONNECT_API_KEY_ID"],os.environ["APP_STORE_CONNECT_ISSUER_ID"],os.environ["APP_STORE_CONNECT_API_KEY_CONTENT"])
          app_id=os.environ["ASC_APP_ID"];number=os.environ["BUILD_NUMBER"];version=os.environ["MARKETING_VERSION"]
          app=asc.verify_app(token,app_id,"com.daypage.app")
          build=asc.find_build(token,app_id,number,version)
          if not build:raise RuntimeError("Exact released iOS build not found")
          build_id=build["id"]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect)
          def sanitize(value,limit):
              return str(value).replace(token,"[redacted]").replace(os.environ["APP_STORE_CONNECT_API_KEY_CONTENT"],"[redacted]")[:limit]
          def request(path,query=None):
              url=asc.ASC_BASE+path+("?"+urllib.parse.urlencode(query) if query else "")
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              try:
                  with opener.open(req,timeout=30) as response:return response.status,json.load(response)
              except urllib.error.HTTPError as error:
                  status=error.code
                  try:data=json.load(error)
                  except Exception:data={}
                  safe=[]
                  for item in data.get("errors",[]):
                      entry={key:sanitize(item.get(key,""),160) for key in ["code","title"]}
                      entry["parameter"]=sanitize((item.get("source") or {}).get("parameter",""),100)
                      safe.append(entry)
                  return status,{"errors":safe}
          status,detail=request("/v1/builds/"+urllib.parse.quote(build_id,safe="")+"/buildBetaDetail")
          if status!=200:raise RuntimeError("Beta detail read failed")
          result={"appId":app_id,"bundleId":"com.daypage.app","marketingVersion":version,"buildNumber":number,"buildId":build_id,"processingState":build["attributes"].get("processingState"),"expired":build["attributes"].get("expired"),"expirationDate":build["attributes"].get("expirationDate"),"betaDetail":detail["data"]["attributes"],"sourceSha":os.environ["RELEASE_SOURCE_SHA"],"readOnlyDiagnostic":True,"queries":[]}
          variants=[("app_path","/v1/apps/"+app_id+"/betaGroups",{"limit":50}),
                    ("app_only","/v1/betaGroups",{"filter[app]":app_id,"limit":50}),
                    ("app_build","/v1/betaGroups",{"filter[app]":app_id,"filter[builds]":build_id,"limit":50}),
                    ("app_fields","/v1/betaGroups",{"filter[app]":app_id,"fields[betaGroups]":"name,isInternalGroup","limit":200}),
                    ("exact_failed_query","/v1/betaGroups",{"filter[app]":app_id,"filter[builds]":build_id,"fields[betaGroups]":"name,isInternalGroup","limit":200})]
          for label,path,query in variants:
              status,data=request(path,query)
              row={"label":label,"status":status}
              if status==200:
                  row["groups"]=[{"id":g["id"],"name":g.get("attributes",{}).get("name"),"isInternalGroup":g.get("attributes",{}).get("isInternalGroup")} for g in data.get("data",[])]
                  if label=="app_path" and row["groups"]:
                      group_id=row["groups"][0]["id"]
                      code,links=request("/v1/betaGroups/"+urllib.parse.quote(group_id,safe="")+"/relationships/builds",{"limit":200})
                      row["buildLinks"]={"status":code,"targetOnFirstPage":any(x.get("id")==build_id for x in links.get("data",[]))}
              else:row["errors"]=data.get("errors",[])
              result["queries"].append(row)
          with open("apple-diagnostic.json","w") as stream:json.dump(result,stream,indent=2)
          print(json.dumps(result))
          PY

      - name: Save Apple build verification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-diagnostic-${{ steps.ids.outputs.release_tag }}
          path: apple-diagnostic.json
          if-no-files-found: ignore
          retention-days: 30
