name: Project Automation

on:
  pull_request:
    types: [opened, reopened]
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        if: ${{ env.PROJECT_TOKEN != '' }}
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          project-url: https://github.com/orgs/getyak/projects/1
          github-token: ${{ secrets.PROJECT_TOKEN }}
