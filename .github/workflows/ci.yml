name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "design/**"
      - "docs/**"
      - ".agents/**"
      - ".codex/**"
      - ".claude/skills/**"
      - "scripts/ralph/**"
      - "tasks/**"
      - "**.md"
      - ".gitignore"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths-ignore:
      - "design/**"
      - "docs/**"
      - ".agents/**"
      - ".codex/**"
      - ".claude/skills/**"
      - "scripts/ralph/**"
      - "tasks/**"
      - "**.md"
      - ".gitignore"
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "0 2 * * *"   # 每天 UTC 02:00（北京时间 10:00）对 main 跑全量回归

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Swift Unit Tests
    runs-on: macos-15
    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show Swift version
        run: xcrun swift --version

      - name: Run all unit tests (fail-fast=false)
        run: bash scripts/ci/run_script_tests.sh

      - name: Run DayPageKit package tests
        run: swift test --package-path DayPageKit

  secrets-audit:
    name: Secrets Hygiene Audit
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify GeneratedSecrets.swift is gitignored
        run: |
          if git ls-files --error-unmatch DayPage/Config/GeneratedSecrets.swift 2>/dev/null; then
            echo "::error::GeneratedSecrets.swift is tracked by git — remove it and add to .gitignore"
            exit 1
          fi
          echo "✅ GeneratedSecrets.swift is correctly gitignored"

      - name: Verify .env is gitignored
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git — remove it immediately (contains production secrets)"
            exit 1
          fi
          echo "✅ .env is correctly gitignored"

      - name: Check .env.example covers all keys used by generate_secrets.sh
        run: |
          # Extract keys read by the script
          SCRIPT_KEYS=$(grep -E '^[A-Z_]+=\$\(read_env_value ' scripts/generate_secrets.sh \
            | sed 's/.*read_env_value "\(.*\)".*/\1/' | sort)
          # Extract keys declared in .env.example
          EXAMPLE_KEYS=$(grep -E '^[A-Z_]+=' .env.example | cut -d= -f1 | sort)
          MISSING=$(comm -23 <(echo "$SCRIPT_KEYS") <(echo "$EXAMPLE_KEYS"))
          if [ -n "$MISSING" ]; then
            echo "::error::.env.example is missing keys used by generate_secrets.sh: $MISSING"
            exit 1
          fi
          echo "✅ .env.example covers all keys: $SCRIPT_KEYS"

      - name: Scan for hardcoded secrets patterns
        run: |
          FAIL=0
          # Look for real key prefixes in tracked Swift/YAML/JSON files (not .env.example or gitignored paths)
          for PATTERN in "sk-[0-9a-f]{32}" "sk-proj-[A-Za-z0-9_-]{40}" "ghp_[A-Za-z0-9]{36}" "lin_api_[A-Za-z0-9]{40}"; do
            HITS=$(git grep -rE "$PATTERN" -- '*.swift' '*.yml' '*.yaml' '*.json' '*.plist' 2>/dev/null | grep -v '\.env\.example' || true)
            if [ -n "$HITS" ]; then
              echo "::error::Hardcoded secret pattern '$PATTERN' found in tracked files:"
              echo "$HITS"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "✅ No hardcoded secret patterns found in tracked files"

  localization-parity:
    name: Localization Key Parity (en/zh)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check en.lproj / zh-Hans.lproj key parity
        run: bash scripts/check_localization_parity.sh

  swiftlint:
    name: SwiftLint (baseline, non-blocking)
    runs-on: macos-15
    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    # R4-LOW #42 — first SwiftLint pass on a 100kLOC codebase. We deliberately
    # run with `|| true` so it never fails the build during the baseline
    # period; once we burn down the existing violations we'll drop the suffix
    # and make it gate-the-merge.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install SwiftLint
        run: brew install swiftlint || true

      - name: Run SwiftLint
        run: swiftlint --strict || true

  tokens-check:
    name: Design Tokens Drift Check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Regenerate tokens from design-tokens/tokens.json
        run: |
          node --experimental-strip-types design-tokens/generators/to-css.ts
          node --experimental-strip-types design-tokens/generators/to-swift.ts

      - name: Fail if generated files drifted from tokens.json
        run: |
          if ! git diff --exit-code -- web/src/app/globals.css DayPage/App/DSTokens.swift; then
            echo "::error::Generated tokens are out of sync with design-tokens/tokens.json. Run \`make tokens-build\` and commit the result."
            exit 1
          fi
          echo "✅ Generated tokens match design-tokens/tokens.json"

  backend-security:
    name: Backend security and contract checks
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.4 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend contracts and security regressions
        run: pnpm backend:check

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agentry/go.mod
          cache-dependency-path: agentry/go.sum

      - name: Test, vet, and build Agentry
        working-directory: agentry
        run: |
          go test ./...
          go vet ./...
          go build ./...

  xcode-tests:
    name: Xcode Unit Tests (DayPageTests)
    runs-on: macos-15
    needs: unit-tests
    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "Selecting: $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-tests-${{ hashFiles('DayPage.xcodeproj/project.pbxproj') }}-${{ runner.os }}
          restore-keys: |
            deriveddata-tests-${{ hashFiles('DayPage.xcodeproj/project.pbxproj') }}-
            deriveddata-tests-

      # Same CI placeholder used by the build job. Required because the test
      # build links against the app target which references Secrets.*.
      - name: Ensure GeneratedSecrets.swift exists
        run: bash scripts/ci/write_placeholder_secrets.sh

      - name: Run DayPageTests
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available --json 2>/dev/null \
            | python3 scripts/ci/select_simulator.py \
                --format destination --fallback-name "iPhone 16")
          echo "Using simulator: $DEST"
          xcodebuild test \
            -scheme DayPage \
            -destination "$DEST" \
            -configuration Debug \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcode-tests.log

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DayPageTests-xcresult-${{ github.sha }}
          path: TestResults.xcresult
          retention-days: 7

  build:
    name: Xcode Build (no signing)
    runs-on: macos-15
    needs: [unit-tests, xcode-tests]
    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Project uses iOS 26 SDK APIs (AVAudioSession.allowBluetoothHFP, etc.).
      # Pick the newest Xcode available on the runner — macos-15 image usually
      # pre-installs several Xcode versions under /Applications/Xcode_*.app.
      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "Selecting: $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphonesimulator
          xcrun --show-sdk-version --sdk iphonesimulator

      - name: Cache DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/DD
          key: deriveddata-ci-${{ hashFiles('DayPage.xcodeproj/project.pbxproj') }}-${{ runner.os }}
          restore-keys: |
            deriveddata-ci-${{ hashFiles('DayPage.xcodeproj/project.pbxproj') }}-
            deriveddata-ci-

      # CI builds use one deterministic, non-sensitive placeholder. Real
      # credentials remain runtime-only and are never read by this workflow.
      - name: Ensure GeneratedSecrets.swift exists
        run: bash scripts/ci/write_placeholder_secrets.sh

      - name: Build (simulator, CODE_SIGNING_ALLOWED=NO)
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available --json 2>/dev/null \
            | python3 scripts/ci/select_simulator.py \
                --format destination --fallback-name "iPhone 16")
          echo "Using simulator: $DEST"
          # NOTE 1: no `-sdk iphonesimulator` — a global -sdk override applies
          # to EVERY target, so the embedded DayPageWatch app got compiled
          # against the iPhone SDK and died on `import WatchKit`.
          # NOTE 2: no `CONFIGURATION_BUILD_DIR` — flattening products into
          # one dir makes the shared SPM packages (DayPageModels etc.) build
          # once per platform (iphonesimulator + watchsimulator) into the SAME
          # path → "Multiple commands produce". -derivedDataPath keeps the
          # per-platform Products/ subdirs.
          xcodebuild \
            -scheme DayPage \
            -destination "$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_CONTENT_PROTECTION=NO \
            -derivedDataPath $PWD/build/DD \
            build 2>&1 | tee build.log
          grep 'BUILD SUCCEEDED' build.log

      - name: Export built .app path
        id: app_path
        run: |
          APP=$(find build/DD/Build/Products -name "DayPage.app" -maxdepth 3 | head -1)
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"
          echo "Found .app: $APP"

      - name: Upload .app for UI tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DayPage-app-${{ github.sha }}
          path: build/DD/Build/Products/Debug-iphonesimulator
          retention-days: 1

  ui-tests:
    name: Maestro UI Tests
    runs-on: macos-15
    # 前置开销(装 Maestro+起模拟器)约 7 min,4 条 flow 全跑完约 15-20 min;
    # 20 min 预算会在 flow 全通过时被 job 超时掐掉(表现为整个 run "cancelled")
    timeout-minutes: 35
    needs: build
    # 仅 PR 和定时任务运行 UI 测试（push 跳过，加快常规开发循环）
    if: (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'schedule'
    permissions:
      contents: read
      pull-requests: write   # 允许发 PR comment

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi

      - name: Download built .app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DayPage-app-${{ github.sha }}
          path: build/Products

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=1.39.0
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iPhone Simulator
        run: |
          UDID=$(xcrun simctl list devices available --json 2>/dev/null \
            | python3 scripts/ci/select_simulator.py --format udid)
          echo "Booting simulator UDID: $UDID"
          xcrun simctl boot "$UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install app on Simulator
        run: |
          APP=$(find build/Products -name "DayPage.app" -maxdepth 3 | head -1)
          echo "Installing: $APP"
          xcrun simctl install "$SIMULATOR_UDID" "$APP"

      # Preset UserDefaults so the Maestro flows skip onboarding + auth and land
      # directly on TodayView. Maestro's iOS LaunchAppHandler.swift (in the
      # XCUITest runner) only calls XCUIApplication.activate() — it does NOT
      # forward `launchApp.arguments` from the YAML, so the values that flows
      # 01/02/04 pass (`hasOnboarded: "true"`, `authSkipped: "true"`) are
      # silently dropped. Writing directly to the simulator's defaults database
      # works around this without touching app source.
      - name: Preset onboarding / auth flags for Maestro
        run: |
          # RootView.initialPhase() checks THREE gates in order:
          #   hasOnboarded → hasSeenWelcome → (authSkipped || session)
          # All three must pass to land on TodayView. Missing any one and
          # Maestro can't reach sidebar-menu-button / memo-input.
          xcrun simctl spawn "$SIMULATOR_UDID" \
            defaults write com.daypage.app hasOnboarded -bool YES
          xcrun simctl spawn "$SIMULATOR_UDID" \
            defaults write com.daypage.app hasSeenWelcome -bool YES
          xcrun simctl spawn "$SIMULATOR_UDID" \
            defaults write com.daypage.app authSkipped -bool YES
          # Two more gates discovered via diag-after-launch.png (2026-07-17):
          # without hasRequestedNotifications the app fires the iOS
          # notification-permission dialog at cold launch — a SYSTEM alert
          # Maestro cannot see past, which is why flows died on
          # "Element not found: Archive" while Today was rendered right
          # behind it. And the first-run input-bar tutorial (Skip/Next
          # overlay) sits on top of the dock, hiding expand-text-composer.
          xcrun simctl spawn "$SIMULATOR_UDID" \
            defaults write com.daypage.app hasRequestedNotifications -bool YES
          xcrun simctl spawn "$SIMULATOR_UDID" \
            defaults write com.daypage.app inputBarTutorialCompleted -bool YES
          # Pin app + system language to English so Maestro flow selectors
          # like "Archive" / "Today" / "Graph" match the rendered sidebar.
          # Without this the runner defaults to zh-Hans (the dev locale)
          # and the sidebar reads "归档/今日/图谱", which the flows can't see.
          # AppleLanguages is read at app launch from NSGlobalDomain, so
          # writing it here before the cold launch is enough.
          xcrun simctl spawn "$SIMULATOR_UDID" \
            defaults write com.daypage.app AppleLanguages -array en
          xcrun simctl spawn "$SIMULATOR_UDID" \
            defaults write com.daypage.app AppleLocale en_US
          # Sanity print so the CI log shows the values that took effect.
          xcrun simctl spawn "$SIMULATOR_UDID" \
            defaults read com.daypage.app hasOnboarded || true
          xcrun simctl spawn "$SIMULATOR_UDID" \
            defaults read com.daypage.app hasSeenWelcome || true
          xcrun simctl spawn "$SIMULATOR_UDID" \
            defaults read com.daypage.app authSkipped || true
          xcrun simctl spawn "$SIMULATOR_UDID" \
            defaults read com.daypage.app AppleLanguages || true

      # Diagnostic: cold-launch the app once and screenshot what the user
      # actually sees. Maestro's debug-output only captures snapshots on
      # element-not-found, so when the issue is "wrong screen rendered" we
      # have nothing to debug from. This step writes diag-after-launch.png
      # which the upload-artifact step at the bottom always picks up.
      - name: Diagnostic — screenshot first-launch state
        run: |
          mkdir -p maestro-results
          xcrun simctl launch "$SIMULATOR_UDID" com.daypage.app || true
          sleep 4
          xcrun simctl io "$SIMULATOR_UDID" screenshot \
            maestro-results/diag-after-launch.png || true
          xcrun simctl terminate "$SIMULATOR_UDID" com.daypage.app || true
          ls -la maestro-results/

      - name: Run Maestro flows
        id: maestro
        env:
          MAESTRO_DEVICE_ID: ${{ env.SIMULATOR_UDID }}
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          mkdir -p maestro-results
          maestro test flows/ \
            --format junit \
            --output maestro-results/report.xml \
            --debug-output maestro-results/debug \
            || echo "MAESTRO_FAILED=true" >> "$GITHUB_ENV"

      - name: Upload Maestro results & screenshots
        if: always()
        id: upload_results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-results-${{ github.sha }}
          path: maestro-results/
          retention-days: 7

      - name: Comment on PR with test results
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.upload_results.outputs.artifact-url }}
        run: |
          if [ "${MAESTRO_FAILED}" = "true" ]; then
            ICON="❌"
            STATUS="Failed"
          else
            ICON="✅"
            STATUS="Passed"
          fi

          # 收集截图文件名（最多 5 张，debug output 目录下的 screenshots）
          SCREENSHOTS=$(find maestro-results/debug -name "*.png" 2>/dev/null | head -5 || true)
          SCREENSHOT_LIST=""
          if [ -n "$SCREENSHOTS" ]; then
            SCREENSHOT_LIST="\n\n**Screenshots** (from last failed step):\n"
            for f in $SCREENSHOTS; do
              NAME=$(basename "$f")
              SCREENSHOT_LIST+="- \`$NAME\`\n"
            done
            SCREENSHOT_LIST+="\n[📁 Download all screenshots & report]($ARTIFACT_URL)"
          fi

          BODY="${ICON} **Maestro UI Tests ${STATUS}**

          | | |
          |---|---|
          | Flows | \`flows/\` |
          | Device | iPhone 17 Simulator |
          | Run | [View logs](${RUN_URL}) |
          ${SCREENSHOT_LIST}"

          gh pr comment "$PR_NUMBER" \
            --body "$(printf '%s' "$BODY")" \
            --edit-last 2>/dev/null \
            || gh pr comment "$PR_NUMBER" --body "$(printf '%s' "$BODY")"

      - name: Fail job if Maestro tests failed
        if: env.MAESTRO_FAILED == 'true'
        run: exit 1
